spring.application.name=monitor-cripto-foro
server.port=${PORT:8080}

# Configura MONGODB_URI en Render/Railway (en local usa --spring.profiles.active=local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/monitor_cripto}
spring.data.mongodb.auto-index-creation=true

# Carga inicial masiva de 1,500 criptomonedas + 150 snapshots históricos en MongoDB
app.seed-on-startup=true
app.seed-limit=1500

# Captura automática de nuevos snapshots cada 90 segundos (actualiza SSE en vivo)
app.scheduler.enabled=true
app.scheduler.interval-ms=90000

